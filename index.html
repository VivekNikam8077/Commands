<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cmdref // linux command lookup</title>
<style>
  :root{
    --bg: #0b0c0e;
    --bg-raised: #141517;
    --bg-raised-2: #1b1c1f;
    --border: #2a2b2f;
    --border-soft: #201f22;
    --amber: #ffb300;
    --amber-dim: #a8760a;
    --amber-glow: rgba(255,179,0,0.12);
    --text: #e9e7e1;
    --text-dim: #86847c;
    --text-faint: #55534c;
    --green: #5fd97a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--amber-glow), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* subtle scanline texture, very low opacity */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 2px
    );
    z-index:1;
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:48px 20px 100px;
    position:relative;
    z-index:2;
  }

  header{
    margin-bottom:28px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .brand .lb{
    color:var(--amber);
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.02em;
  }
  .brand .lb::before{content:"~/";color:var(--text-faint);}
  .brand .tagline{
    color:var(--text-faint);
    font-size:12px;
  }
  .stats{
    color:var(--text-faint);
    font-size:12px;
  }
  .stats b{color:var(--text-dim);font-weight:600;}

  /* search bar styled like a terminal prompt */
  .promptbar{
    position:sticky;
    top:16px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,0.6);
    margin-bottom:26px;
  }
  .promptbar:focus-within{
    border-color:var(--amber-dim);
    box-shadow:0 0 0 3px var(--amber-glow), 0 10px 30px -12px rgba(0,0,0,0.6);
  }
  .promptbar .glyph{
    color:var(--amber);
    font-weight:700;
    font-size:16px;
    flex-shrink:0;
  }
  .promptbar input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    caret-color:var(--amber);
  }
  .promptbar input::placeholder{color:var(--text-faint);}
  .clear-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    cursor:pointer;
    font-family:var(--mono);
    font-size:13px;
    padding:4px 8px;
    border-radius:6px;
    display:none;
  }
  .clear-btn:hover{color:var(--text-dim);background:var(--bg-raised-2);}
  .clear-btn.show{display:block;}

  .hint-row{
    display:flex;
    justify-content:space-between;
    color:var(--text-faint);
    font-size:11px;
    margin:-16px 0 22px;
    padding:0 4px;
  }
  .hint-row kbd{
    background:var(--bg-raised-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1px 5px;
    font-size:10px;
    color:var(--text-dim);
  }

  #results{display:flex;flex-direction:column;gap:14px;}

  .card{
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    animation:rise 0.15s ease-out;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(3px);}
    to{opacity:1;transform:translateY(0);}
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(255,179,0,0.04), transparent);
  }
  .card-head .cmd-name{
    color:var(--amber);
    font-size:16px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .card-head .cmd-desc{
    color:var(--text-dim);
    font-size:12.5px;
    margin-top:3px;
  }
  .card-head .count-badge{
    color:var(--text-faint);
    font-size:11px;
    border:1px solid var(--border);
    padding:2px 8px;
    border-radius:20px;
    flex-shrink:0;
    white-space:nowrap;
  }

  .variant{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    border-bottom:1px solid var(--border-soft);
  }
  .variant:last-child{border-bottom:none;}
  .variant:hover{background:rgba(255,255,255,0.015);}

  .variant .flag{
    color:var(--text);
    font-size:14px;
    background:var(--bg-raised-2);
    border:1px solid var(--border);
    padding:5px 9px;
    border-radius:6px;
    white-space:nowrap;
    flex-shrink:0;
    min-width:0;
  }
  .variant .flag mark{
    background:var(--amber-glow);
    color:var(--amber);
    border-radius:2px;
  }
  .variant .fdesc{
    color:var(--text-dim);
    font-size:13px;
    line-height:1.45;
    flex:1;
  }
  .variant .fdesc mark{
    background:var(--amber-glow);
    color:var(--amber);
    border-radius:2px;
  }

  .copy-btn{
    flex-shrink:0;
    background:var(--bg-raised-2);
    border:1px solid var(--border);
    color:var(--text-faint);
    cursor:pointer;
    border-radius:6px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .12s, color .12s;
  }
  .copy-btn:hover{color:var(--amber);border-color:var(--amber-dim);}
  .copy-btn.copied{color:var(--green);border-color:var(--green);}
  .copy-btn svg{width:14px;height:14px;}

  .empty-state{
    text-align:center;
    color:var(--text-faint);
    padding:60px 20px;
    font-size:13px;
  }
  .empty-state .big{
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:6px;
  }

  footer{
    text-align:center;
    color:var(--text-faint);
    font-size:11px;
    margin-top:50px;
  }

  @media (max-width:520px){
    .wrap{padding:28px 14px 80px;}
    .variant{flex-wrap:wrap;}
    .variant .flag{font-size:13px;}
  }

  ::selection{background:var(--amber-glow);color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="lb">cmdref</span>
      <span class="tagline">// offline linux command lookup</span>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="promptbar">
    <span class="glyph">$</span>
    <input id="search" type="text" placeholder="search a command, e.g. ls, ss, grep, chmod..." autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <button class="clear-btn" id="clearBtn">clear ✕</button>
  </div>
  <div class="hint-row">
    <span>type to filter instantly</span>
    <span><kbd>Esc</kbd> clear &nbsp; <kbd>click</kbd> copy button to copy a command</span>
  </div>

  <div id="results"></div>
  <footer>runs entirely in your browser · no server, no network calls · save this file anywhere</footer>
</div>

 {f:"cp -p a b",d:"Preserve mode, ownership and timestamps"},

{cmd:"grep",desc:"Search text using patterns",variants:[

 {f:"grep -v pattern file",d:"Invert match: show lines that do NOT match"},
 {f:"grep -n pattern file",d:"Show line numbers with matches"},
 {f:"grep -c pattern file",d:"Show only the count of matching lines"},
 {f:"grep -l pattern *",d:"Show only filenames that contain a match"},
 {f:"grep -E 'a|b' file",d:"Extended regex, enables patterns like alternation (a|b)"},
 {f:"grep -w pattern file",d:"Match whole words only"},
 {f:"grep -A3 -B3 pattern file",d:"Show 3 lines of context after (A) and before (B) each match"},
]},
{cmd:"sed",desc:"Stream editor for filtering and transforming text",variants:[
 {f:"sed 's/old/new/' file",d:"Replace the first occurrence of old with new on each line"},
 {f:"sed 's/old/new/g' file",d:"Replace ALL occurrences on each line"},
 {f:"sed -i 's/old/new/g' file",d:"Edit the file in place instead of printing to stdout"},
 {f:"sed -n '2,4p' file",d:"Print only lines 2 through 4"},
 {f:"sed '/pattern/d' file",d:"Delete lines matching a pattern"},

{cmd:"awk",desc:"Pattern scanning and text processing language",variants:[

<script>(function(){
  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  const statsEl = document.getElementById('stats');
  const clearBtn = document.getElementById('clearBtn');

  const totalCmds = DATA.length;
  const totalFlags = DATA.reduce((n,c)=>n+c.variants.length,0);
  statsEl.textContent = totalCmds + ' commands · ' + totalFlags + ' flag references — all baked in, works offline';

  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(text, q){
    const safe = escapeHtml(text);
    if(!q) return safe;
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return safe;
    const before = escapeHtml(text.slice(0, idx));
    const match = escapeHtml(text.slice(idx, idx+q.length));
    const after = escapeHtml(text.slice(idx+q.length));
    return before + '<mark>' + match + '</mark>' + after;
  }

  // Precompute lowercase fields once for speed.
  DATA.forEach(c=>{
    c._cmdLower = c.cmd.toLowerCase();
    c._descLower = c.desc.toLowerCase();
    c.variants.forEach(v=>{ v._flagLower = v.f.toLowerCase(); v._dLower = v.d.toLowerCase(); });
  });

  function score(cmd, q){
    // Lower is better. Returns null if no match at all.
    if(!q) return 0;
    if(cmd._cmdLower === q) return 0;
    if(cmd._cmdLower.startsWith(q)) return 1;
    if(cmd._cmdLower.includes(q)) return 2;
    // check variants for flag match (e.g. "-tulpn" or "tulpn")
    for(const v of cmd.variants){
      if(v._flagLower.includes(q)) return 3;
    }
    // Description matching only kicks in for queries specific enough
    // to avoid short substrings (e.g. "ss") flooding results with
    // unrelated words like "process" or "class".
    if(q.length < 3) return null;
    if(cmd._descLower.includes(q)) return 4;
    for(const v of cmd.variants){
      if(v._dLower.includes(q)) return 5;
    }
    return null;
  }

  function render(query){
    const q = query.trim().toLowerCase();
    clearBtn.classList.toggle('show', q.length > 0);

    let list;
    if(!q){
      list = DATA.map(c=>({c, s:0}));
    } else {
      list = [];
      for(const c of DATA){
        const s = score(c, q);
        if(s !== null) list.push({c, s});
      }
      list.sort((a,b)=> a.s - b.s || a.c.cmd.localeCompare(b.c.cmd));
    }

    if(list.length === 0){
      resultsEl.innerHTML = '<div class="empty-state"><div class="big">no matches for "'+escapeHtml(query)+'"</div>try a shorter or different keyword</div>';
      return;
    }

    const frag = document.createDocumentFragment();
    for(const {c} of list){
      const card = document.createElement('div');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'card-head';
      head.innerHTML =
        '<div><div class="cmd-name">'+highlight(c.cmd, q)+'</div><div class="cmd-desc">'+highlight(c.desc, q)+'</div></div>'+
        '<div class="count-badge">'+c.variants.length+' variant'+(c.variants.length>1?'s':'')+'</div>';
      card.appendChild(head);

      for(const v of c.variants){
        const row = document.createElement('div');
        row.className = 'variant';
        row.innerHTML =
          '<code class="flag">'+highlight(v.f, q)+'</code>'+
          '<span class="fdesc">'+highlight(v.d, q)+'</span>'+
          '<button class="copy-btn" type="button" aria-label="Copy '+escapeHtml(v.f)+'">'+copyIcon+'</button>';
        const btn = row.querySelector('.copy-btn');
        btn.addEventListener('click', ()=> doCopy(btn, v.f));
        card.appendChild(row);
      }

      frag.appendChild(card);
    }
    resultsEl.innerHTML = '';
    resultsEl.appendChild(frag);
  }

  function doCopy(btn, text){
    const reset = ()=>{
      btn.classList.remove('copied');
      btn.innerHTML = copyIcon;
    };
    const success = ()=>{
      btn.classList.add('copied');
      btn.innerHTML = checkIcon;
      setTimeout(reset, 1100);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(success).catch(()=>fallbackCopy(text, success));
    } else {
      fallbackCopy(text, success);
    }
  }

  function fallbackCopy(text, success){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand('copy'); success(); }catch(e){}
    document.body.removeChild(ta);
  }

  let raf = null;
  searchEl.addEventListener('input', ()=>{
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=> render(searchEl.value));
  });

  clearBtn.addEventListener('click', ()=>{
    searchEl.value = '';
    searchEl.focus();
    render('');
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      searchEl.value = '';
      render('');
      searchEl.blur();
    } else if(e.key === '/' && document.activeElement !== searchEl){
      e.preventDefault();
      searchEl.focus();
    }
  });

  render('');
})();</script>
